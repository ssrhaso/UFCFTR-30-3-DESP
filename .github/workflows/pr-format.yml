name: PR format

# Each pull request must link to its Jira story and close its GitHub issue.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  check:
    name: Title and body
    runs-on: ubuntu-latest
    # Bot pull requests (for example Dependabot) do not follow the Jira rule.
    if: ${{ !endsWith(github.event.pull_request.user.login, '[bot]') }}
    steps:
      - name: Check the title and the body
        env:
          # Passed through env, never inline, so the text cannot run as shell code.
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          status=0
          if [[ ! "$TITLE" =~ ^SCRUM-[0-9]+ ]]; then
            echo "::error title=PR title::The title must start with the Jira key, for example \"SCRUM-12 Add the message flows\"."
            status=1
          fi
          if ! grep -Eiq '\b(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' <<< "$BODY"; then
            echo "::error title=PR body::The body must close its issue, for example \"Closes #31\"."
            status=1
          fi
          if [[ $status -eq 0 ]]; then
            echo "The title and the body follow the rules."
          fi
          exit $status
